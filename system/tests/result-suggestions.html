<!doctype html>
<html><head><meta charset="utf-8"><title>Result suggestion checks</title></head>
<body><pre id="result">RUNNING</pre><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { MemoryRouter, Routes, Route } from 'react-router-dom';
import { CurrentUserProvider } from '/src/shared/auth/CurrentUserContext.tsx';
import StudyResultsPage from '/src/modules/StudyResults/StudyResultsPage.tsx';

// Synthetic evidence only. Every request is intercepted; no backend or provider is contacted.
const failures = [];
window.addEventListener('error', e => failures.push(e.message));
window.addEventListener('unhandledrejection', e => failures.push(String(e.reason)));
const state = { results: [], sections: [], supportingDocuments: [], locked: false,
  sectionOptions: [{ id: null, key: 'performance', title: 'Clinical Performance Results' },
    { id: null, key: 'safety', title: 'Safety Analysis' }] };
const response = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
const pending = [];
let active = 0, maxActive = 0;
let failNextSave = false;
let failNextRefresh = false;
let nextDocumentId = 0;
window.confirm = () => true;
const suggestion = { title: 'Infusion volume accuracy', reportSectionKey: 'performance',
  placementBasisLabel: 'no TFL, based on content',
  description: '190 episodes (95%) were within ±5%.', limitation: null };
const source = { headers: ['Outcome', 'Episodes', '%'], rows: [['Within ±5%', 190, 95], ['Outside', 10, 5]],
  provenance: { header: [{ filename: 'synthetic.xlsx', rowStart: 1, rowEnd: 1, columnStart: 1, columnEnd: 3 }],
    rows: [2, 3].map(n => [{ filename: 'synthetic.xlsx', rowStart: n, rowEnd: n, columnStart: 1, columnEnd: 3 }]) } };
window.fetch = async (url, init = {}) => {
  const path = String(url);
  if (path.endsWith('/workspace')) {
    if (failNextRefresh) { failNextRefresh = false; return response({ message: 'Refresh failed.' }, 503); }
    return response(state);
  }
  if (path.endsWith('/supporting-documents') && init.method === 'POST') {
    const doc = { id: `support-${++nextDocumentId}`, type: init.body.get('type'), filename: init.body.get('file').name,
      uploadedAt: '2026-09-30T12:00:00Z', uploaderName: 'Test author', sizeBytes: 10 };
    state.supportingDocuments.push(doc);
    return response({ id: doc.id }, 201);
  }
  if (path.includes('/supporting-documents/') && init.method === 'DELETE') {
    state.supportingDocuments = state.supportingDocuments.filter(doc => doc.id !== path.split('/').pop());
    return new Response(null, { status: 204 });
  }
  if (path.endsWith('/milestones')) return response({ milestones: [] });
  if (path.endsWith('/preview')) {
    const filename = init.body.get('file').name;
    return response({ issues: [], drafts: Array.from({ length: filename === 'five.xlsx' ? 5 : 1 }, (_, i) => ({
      title: `${filename} sheet ${i + 1}`, type: filename.endsWith('.txt') ? 'listing' : 'table',
      content: filename.endsWith('.txt')
        ? { text: 'Synthetic dataset: volume accuracy and adverse event results.' }
        : structuredClone(source), sourceFilename: filename,
    })) });
  }
  if (path.endsWith('/suggest')) {
    active++; maxActive = Math.max(maxActive, active);
    return new Promise((resolve, reject) => {
      let finished = false;
      const finish = (body = suggestion, status = 200) => {
        if (finished) return;
        finished = true; active--; resolve(response(body, status));
      };
      init.signal?.addEventListener('abort', () => {
        if (finished) return;
        finished = true; active--; reject(new DOMException('Aborted', 'AbortError'));
      });
      pending.push({ body: JSON.parse(init.body), finish });
    });
  }
  if (path.endsWith('/results') && init.method === 'POST') {
    if (failNextSave) { failNextSave = false; return response({ message: 'Save failed. Try again.' }, 503); }
    const body = JSON.parse(init.body);
    const item = { titleOrigin: 'human', sectionOrigin: 'human', descriptionOrigin: 'human', ...body,
      id: `r-${state.results.length}`, reportSectionId: body.reportSectionKey ? 'saved-section' : null,
      version: 1, status: 'draft', placement: 'unplaced', reportNumber: state.results.length + 1, lastDecision: null };
    delete item.reportSectionKey;
    state.results.push(item);
    state.sections = [{ id: 'saved-section', title: 'Clinical Performance Results' }];
    state.sectionOptions[0].id = 'saved-section';
    return response(item, 201);
  }
  throw new Error(`Unexpected API call: ${path}`);
};
const root = createRoot(document.getElementById('root'));
const render = key => root.render(React.createElement(MemoryRouter, { key, initialEntries: ['/projects/fixture/workflow/results'] },
  React.createElement(CurrentUserProvider, { user: { id: 'author', name: 'Author', roles: ['author'] }, status: 'ready' },
    React.createElement(Routes, null, React.createElement(Route, { path: '/projects/:projectId/workflow/results', element: React.createElement(StudyResultsPage) })))));
const wait = async (check, message) => {
  for (let i = 0; i < 250; i++) { if (check()) return; await new Promise(r => setTimeout(r, 20)); }
  throw new Error(message);
};
const assert = (value, message) => { if (!value) throw new Error(message); };
const forms = () => [...document.querySelectorAll('[aria-label="Import preview"] form')];
const button = (text, parent = document) => [...parent.querySelectorAll('button')].find(b => b.textContent.trim() === text);
const setInput = (el, value) => {
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(el, value);
  el.dispatchEvent(new Event('input', { bubbles: true }));
};
const upload = filename => {
  const el = document.querySelector('input[type=file][multiple]');
  const files = new DataTransfer(); files.items.add(new File(['synthetic'], filename));
  el.files = files.files; el.dispatchEvent(new Event('change', { bubbles: true }));
};
const submit = form => form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
const preview = () => document.querySelector('[aria-label="Import preview"]');
const staleMessage = 'TFL files have been added, removed, or replaced. Click “Reanalyze placement” to update this suggestion.';
const attach = (type, filename) => {
  const input = button(`Attach ${type}`).parentElement.querySelector('input[type=file]');
  const files = new DataTransfer(); files.items.add(new File(['synthetic mapping'], filename));
  input.files = files.files; input.dispatchEvent(new Event('change', { bubbles: true }));
};
const startPlacementAnalysis = async () => {
  const index = pending.length;
  const control = button('Reanalyze placement');
  control.click(); control.click();
  await wait(() => pending.length === index + 1 && control.disabled, 'Placement analysis did not start once');
  return pending[index];
};
const setSelect = (element, value) => {
  Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value').set.call(element, value);
  element.dispatchEvent(new Event('change', { bubbles: true }));
};
try {
  render('initial');
  await wait(() => button('Upload file') && !button('Upload file').disabled, 'Workspace did not load');
  upload('five.xlsx');
  await wait(() => forms().length === 5 && pending.length === 1, 'Five drafts or first AI request missing');
  assert(state.results.length === 0, 'Import persisted before Save draft');
  setInput(forms()[0].querySelector('input'), 'My chosen title');
  pending[0].finish();
  for (let i = 1; i < 5; i++) {
    await wait(() => pending.length > i, `Missing queued request ${i}`);
    pending[i].finish();
  }
  await wait(() => forms().every(f => f.querySelector('textarea').value === suggestion.description), 'Descriptions not filled');
  assert(maxActive === 1, 'AI requests were launched concurrently');
  assert(forms()[0].querySelector('input').value === 'My chosen title', 'AI overwrote a human edit');
  assert(forms()[0].textContent.includes('Human-edited'), 'Human origin missing');
  assert(forms()[1].querySelectorAll('select')[1].value === 'key:performance', 'Preview section not assigned');
  assert(forms()[1].textContent.includes('no TFL, based on content'), 'Content basis label missing');
  const info = forms()[1].querySelector('[aria-label="About the AI suggestion for title"]');
  info.click();
  await wait(() => document.querySelector('[role="dialog"]')?.textContent.includes('Review and edit'), 'AI help did not open');
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await wait(() => !document.querySelector('[role="dialog"]'), 'AI help did not close with Escape');
  submit(forms()[1]);
  await wait(() => state.results.length === 1 && forms().length === 4, 'AI draft not saved');
  assert(state.results[0].titleOrigin === 'ai' && state.results[0].sectionOrigin === 'ai' && state.results[0].descriptionOrigin === 'ai', 'AI origins not sent on save');
  assert(!('placementBasisLabel' in state.results[0]), 'Suggestion basis was persisted');
  assert(JSON.stringify(state.results[0].content) === JSON.stringify(source), 'AI changed source values');
  submit(forms()[0]);
  await wait(() => state.results.length === 2 && forms().length === 3, 'Human-edited draft not saved');
  assert(state.results[1].titleOrigin === 'human' && state.results[1].descriptionOrigin === 'ai', 'Mixed origins not preserved');
  render('reload');
  await wait(() => document.body.textContent.includes('Infusion volume accuracy') && !forms().length, 'Reload lost saved result');
  assert(document.querySelector('[aria-label="Result review"]').textContent.includes('AI suggestion'), 'Saved AI label missing');
  assert(!document.body.textContent.includes('no TFL, based on content'), 'Suggestion basis survived reload');

  upload('one.csv');
  await wait(() => pending.length === 6 && forms().length === 1, 'Failure test not imported');
  pending[5].finish({ message: 'AI request timed out.' }, 504);
  await wait(() => button('Retry AI suggestions'), 'Retry missing after timeout');
  assert(forms()[0].querySelector('table'), 'Timeout removed source table');
  setInput(forms()[0].querySelector('input'), 'Keep manual title');
  button('Retry AI suggestions').click();
  await wait(() => pending.length === 7, 'Retry did not call AI');
  pending[6].finish();
  await wait(() => forms()[0].querySelector('textarea').value === suggestion.description, 'Retry suggestion missing');
  assert(forms()[0].querySelector('input').value === 'Keep manual title', 'Retry replaced human title');
  button('Split detection').click();
  await wait(() => forms().length === 2 && pending.length === 8, 'Split did not queue fresh suggestions');
  assert(forms().every(f => f.querySelector('textarea').value === ''), 'Split kept stale descriptions');
  assert(forms().every(f => !f.textContent.includes('no TFL, based on content')), 'Split kept stale basis labels');
  const boxes = [...document.querySelectorAll('[aria-label="Import preview"] input[type=checkbox]')];
  boxes[0].click(); boxes[2].click();
  await wait(() => !button('Merge selected detections').disabled, 'Merge selection missing');
  button('Merge selected detections').click();
  await wait(() => forms().length === 1, 'Merge failed');
  pending[7].finish({ ...suggestion, description: 'STALE split response' });
  await wait(() => pending.length === 9, 'Merged object not queued');
  assert(forms()[0].querySelector('textarea').value === '', 'Stale split response affected merged object');
  pending[8].finish();
  await wait(() => forms()[0].querySelector('textarea').value === suggestion.description, 'Merged suggestion missing');
  button('Cancel', forms()[0]).click();
  await wait(() => !forms().length, 'Cancel failed');

  upload('save-early.csv');
  await wait(() => pending.length === 10 && forms().length === 1, 'Early-save input missing');
  setInput(forms()[0].querySelector('input'), 'Save without AI');
  submit(forms()[0]);
  await wait(() => state.results.length === 3 && !forms().length, 'Pending AI blocked manual save');
  pending[9].finish();
  assert(state.results[2].title === 'Save without AI' && !state.results[2].description, 'Late response changed saved data');

  upload('mixed.txt');
  await wait(() => pending.length === 11 && forms().length === 1, 'Mixed-result input missing');
  const mixed = { title: 'Performance and safety results', reportSectionKey: null,
    placementBasisLabel: 'no TFL, based on content',
    alternativeSectionKeys: ['performance', 'safety'],
    description: 'This synthetic dataset contains performance and safety results.',
    limitation: 'Performance and safety span different sections. Choose placement manually.' };
  pending[10].finish(mixed);
  await wait(() => forms()[0].querySelector('textarea').value === mixed.description, 'Partial suggestion not applied');
  assert(document.querySelector('[aria-label="Import preview"]').textContent.includes(mixed.limitation), 'Placement explanation missing');
  assert(forms()[0].querySelectorAll('select')[1].value === '', 'AI assigned a section despite abstaining');
  assert(forms()[0].querySelectorAll('[aria-label^="About the AI suggestion"]').length === 2, 'Abstention incorrectly marked as an AI section suggestion');
  const mixedSection = forms()[0].querySelectorAll('select')[1];
  const help = document.getElementById(mixedSection.getAttribute('aria-describedby'));
  assert(help?.textContent.includes('Multiple result topics.') && help.textContent.includes('Clinical Performance Results; Safety Analysis'), 'Inline alternatives missing');
  assert(help.textContent.includes('parts of this content'), 'Alternatives imply whole-document placement');
  help.querySelector('button').click();
  await wait(() => document.querySelector('[role="dialog"]')?.textContent.includes(mixed.limitation), 'Placement explanation did not open');
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await wait(() => !document.querySelector('[role="dialog"]'), 'Placement explanation did not close');
  submit(forms()[0]);
  await wait(() => state.results.length === 4 && !forms().length, 'Partial suggestion could not be saved');
  assert(state.results[3].reportSectionId === null && state.results[3].description === mixed.description, 'Partial suggestion changed during save');

  upload('manual-placement.txt');
  await wait(() => pending.length === 12 && forms().length === 1, 'Manual-placement input missing');
  const section = forms()[0].querySelectorAll('select')[1];
  Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value').set.call(section, 'key:performance');
  section.dispatchEvent(new Event('change', { bubbles: true }));
  pending[11].finish(mixed);
  await wait(() => forms()[0].querySelector('textarea').value === mixed.description, 'Manual-placement suggestion missing');
  assert(section.value === 'key:performance' && forms()[0].textContent.includes('Human-edited'), 'Abstention overwrote human placement');
  assert(!forms()[0].textContent.includes('no TFL, based on content'), 'Late response labelled human placement');
  assert(!section.hasAttribute('aria-describedby'), 'Unassigned help remains after manual selection');
  button('Cancel', forms()[0]).click();
  await wait(() => !forms().length, 'Manual-placement draft not cancelled');

  upload('unreadable.txt');
  await wait(() => pending.length === 13 && forms().length === 1, 'Unreadable input missing');
  assert(!forms()[0].querySelector('[aria-label="Why no report section was selected"]'), 'Empty field treated as AI abstention');
  pending[12].finish({ title: null, reportSectionKey: null, description: null,
    limitation: 'Source text is unreadable.', alternativeSectionKeys: [] });
  await wait(() => forms()[0].textContent.includes('AI did not suggest a section.'), 'Generic abstention help missing');
  assert(!forms()[0].textContent.includes('Multiple result topics.'), 'Unreadable source labelled as mixed content');
  button('Cancel', forms()[0]).click();
  await wait(() => !forms().length, 'Unreadable draft not cancelled');

  upload('tfl-mapped.csv');
  await wait(() => pending.length === 14 && forms().length === 1, 'TFL test input missing');
  pending[13].finish({ ...suggestion, placementBasisLabel: 'Using TFL mapping' });
  await wait(() => forms()[0].textContent.includes('Using TFL mapping'), 'TFL mapping label missing');
  const tflSection = forms()[0].querySelectorAll('select')[1];
  const changeSection = value => {
    Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value').set.call(tflSection, value);
    tflSection.dispatchEvent(new Event('change', { bubbles: true }));
  };
  changeSection('key:safety');
  await wait(() => !forms()[0].textContent.includes('Using TFL mapping'), 'Manual change kept TFL label');
  changeSection('key:performance');
  await wait(() => tflSection.value === 'key:performance', 'Section was not restored');
  assert(!forms()[0].textContent.includes('Using TFL mapping') && forms()[0].textContent.includes('Human-edited'), 'Changing back restored stale TFL attribution');
  setInput(forms()[0].querySelector('input'), 'Keep edited TFL result');
  failNextSave = true;
  submit(forms()[0]);
  await wait(() => forms()[0]?.textContent.includes('Save failed'), 'Save error missing');
  assert(forms()[0].querySelector('input').value === 'Keep edited TFL result' && tflSection.value === 'key:performance', 'Save failure discarded edits');
  assert(!forms()[0].textContent.includes('Using TFL mapping'), 'Save failure restored TFL label');
  button('Cancel', forms()[0]).click();
  await wait(() => !forms().length, 'TFL draft not cancelled');

  upload('tfl-unavailable.csv');
  await wait(() => pending.length === 15 && forms().length === 1, 'Unavailable TFL input missing');
  pending[14].finish({ ...suggestion, reportSectionKey: null, placementBasisLabel: null,
    alternativeSectionKeys: [], limitation: 'The attached TFL has conflicting mappings. Select a section manually.' });
  await wait(() => forms()[0].querySelector('textarea').value === suggestion.description, 'TFL abstention lost description');
  assert(forms()[0].querySelectorAll('select')[1].value === '', 'Unavailable TFL caused automatic placement');
  assert(!forms()[0].textContent.includes('Using TFL mapping') && !forms()[0].textContent.includes('no TFL, based on content'), 'Unavailable TFL mislabelled');
  assert(document.querySelector('[aria-label="Import preview"]').textContent.includes('conflicting mappings'), 'TFL limitation missing');
  button('Cancel', forms()[0]).click();
  await wait(() => !forms().length, 'TFL draft not cancelled');

  // Attachment changes invalidate placement only; all API requests remain intercepted.
  let nextRequest = pending.length;
  upload('reanalyze.txt');
  await wait(() => pending.length === nextRequest + 1 && forms().length === 1, 'Reanalysis input missing');
  pending[nextRequest].finish(mixed);
  await wait(() => forms()[0].querySelector('textarea').value === mixed.description, 'Initial mixed suggestion missing');
  const requestCount = pending.length;
  attach('SAP', 'control-sap.txt');
  await wait(() => document.querySelector('[aria-label="Remove control-sap.txt"]') && !button('Attach SAP').disabled, 'SAP not attached');
  assert(!preview().textContent.includes(staleMessage) && !button('Reanalyze placement'), 'SAP invalidated placement');
  assert(preview().textContent.includes(mixed.limitation), 'SAP hid valid placement help');

  forms()[0].querySelector('[aria-label="Why no report section was selected"]').click();
  await wait(() => document.querySelector('[role="dialog"]')?.textContent.includes(mixed.limitation), 'Old explanation not open');
  failNextRefresh = true;
  attach('TFL', 'current-tfl.txt');
  await wait(() => preview().textContent.includes(staleMessage) && !button('Reanalyze placement').disabled, 'TFL upload did not invalidate despite failed refresh');
  assert(!document.body.textContent.includes(mixed.limitation), 'Old placement explanation remains visible');
  assert(!forms()[0].textContent.includes('Multiple result topics.') && !forms()[0].querySelector('[aria-label="Why no report section was selected"]'), 'Old alternatives/help remain visible');
  assert(!preview().textContent.includes('no TFL, based on content'), 'Stale basis label remains visible');
  assert(pending.length === requestCount, 'Attachment change automatically called AI');

  const mapped = { ...suggestion, title: 'Do not replace title', description: 'Do not replace description', placementBasisLabel: 'Using TFL mapping' };
  (await startPlacementAnalysis()).finish(mapped);
  await wait(() => forms()[0].querySelectorAll('select')[1].value === 'key:performance' && !preview().textContent.includes(staleMessage), 'Fresh TFL placement not applied');
  assert(forms()[0].querySelector('input').value === mixed.title && forms()[0].querySelector('textarea').value === mixed.description, 'Placement analysis changed title/description');
  assert(forms()[0].textContent.includes('Using TFL mapping'), 'Fresh basis label missing');

  window.dispatchEvent(new Event('results:refresh'));
  await wait(() => document.querySelector('[aria-label="Remove current-tfl.txt"]'), 'Attachment refresh failed');
  assert(!preview().textContent.includes(staleMessage), 'Delayed attachment refresh invalidated fresh analysis');
  document.querySelector('[aria-label="Remove current-tfl.txt"]').click();
  await wait(() => preview().textContent.includes(staleMessage) && !button('Reanalyze placement').disabled, 'TFL removal did not invalidate');
  assert(forms()[0].querySelectorAll('select')[1].value === 'key:performance', 'TFL removal erased the existing value');
  const unassigned = { ...mixed, title: 'Ignored title', description: 'Ignored description', limitation: 'No suitable destination in the new assessment.' };
  (await startPlacementAnalysis()).finish(unassigned);
  await wait(() => forms()[0].querySelectorAll('select')[1].value === '' && !preview().textContent.includes(staleMessage), 'New abstention did not clear old AI placement');
  assert(forms()[0].querySelector('textarea').value === mixed.description, 'Abstention changed description');

  // A different session's attachment update is detected through workspace refresh.
  state.supportingDocuments.push({ id: 'external-tfl', type: 'tfl', filename: 'external.txt' });
  window.dispatchEvent(new Event('results:refresh'));
  await wait(() => preview().textContent.includes(staleMessage), 'External TFL update was not detected');
  assert(!preview().textContent.includes(unassigned.limitation), 'Stale status explanation remains');
  const manualSection = forms()[0].querySelectorAll('select')[1];
  setSelect(manualSection, 'key:performance');
  await wait(() => forms()[0].textContent.includes('Human-edited'), 'Manual section origin missing');
  setSelect(manualSection, 'key:safety');
  setSelect(manualSection, 'key:performance');
  const manualRequest = await startPlacementAnalysis();
  setInput(forms()[0].querySelector('input'), 'Keep my title during reanalysis');
  const descriptionInput = forms()[0].querySelector('textarea');
  Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set.call(descriptionInput, 'Keep my description during reanalysis');
  descriptionInput.dispatchEvent(new Event('input', { bubbles: true }));
  manualRequest.finish({ ...mapped, reportSectionKey: 'safety' });
  await wait(() => forms()[0].textContent.includes('New AI placement suggestion: Safety Analysis'), 'New proposal not shown separately');
  assert(manualSection.value === 'key:performance' && forms()[0].textContent.includes('Your manual selection is unchanged.'), 'Reanalysis replaced manual section');
  assert(!forms()[0].textContent.includes('Using TFL mapping'), 'Manual section received AI basis label');
  assert(forms()[0].querySelector('input').value === 'Keep my title during reanalysis' && descriptionInput.value === 'Keep my description during reanalysis', 'Reanalysis replaced human text edits');

  state.supportingDocuments = state.supportingDocuments.filter(doc => doc.type !== 'tfl');
  window.dispatchEvent(new Event('results:refresh'));
  await wait(() => preview().textContent.includes(staleMessage), 'External TFL removal was not detected');
  assert(!forms()[0].textContent.includes('New AI placement suggestion'), 'Old manual-review proposal remains visible');
  (await startPlacementAnalysis()).finish({ message: 'AI request timed out.' }, 504);
  await wait(() => preview().textContent.includes('AI request timed out.') && !button('Reanalyze placement').disabled, 'Reanalysis failure cannot be retried');
  assert(preview().textContent.includes(staleMessage) && manualSection.value === 'key:performance', 'AI failure erased warning or manual selection');
  assert(forms()[0].querySelector('input').value === 'Keep my title during reanalysis' && descriptionInput.value === 'Keep my description during reanalysis', 'AI failure erased edits');
  (await startPlacementAnalysis()).finish({ ...mapped, reportSectionKey: 'safety' });
  await wait(() => !preview().textContent.includes(staleMessage), 'Successful retry did not clear warning');
  failNextSave = true;
  submit(forms()[0]);
  await wait(() => forms()[0].textContent.includes('Save failed'), 'Reanalyzed save failure missing');
  assert(manualSection.value === 'key:performance' && descriptionInput.value === 'Keep my description during reanalysis', 'Save failure lost reanalyzed human edits');
  button('Cancel', forms()[0]).click();
  await wait(() => !forms().length, 'Reanalysis draft not cancelled');

  nextRequest = pending.length;
  upload('in-flight-tfl.csv');
  await wait(() => pending.length === nextRequest + 1 && forms().length === 1, 'In-flight input missing');
  attach('TFL', 'during-request.txt');
  await wait(() => preview().textContent.includes(staleMessage) && !button('Attach TFL').disabled, 'Running request not marked stale');
  pending[nextRequest].finish(mapped);
  await wait(() => forms()[0].querySelector('textarea').value === mapped.description && !button('Reanalyze placement').disabled, 'Old running response missing');
  assert(forms()[0].querySelectorAll('select')[1].value === '' && preview().textContent.includes(staleMessage), 'Old response applied stale placement');
  assert(!forms()[0].textContent.includes('Using TFL mapping'), 'Old running response restored stale label');
  const overlapping = await startPlacementAnalysis();
  attach('TFL', 'during-reanalysis.txt');
  await wait(() => document.querySelector('[aria-label="Remove during-reanalysis.txt"]') && !button('Attach TFL').disabled, 'Second concurrent attachment missing');
  overlapping.finish(suggestion);
  await wait(() => !button('Reanalyze placement').disabled, 'Overlapping reanalysis did not finish');
  assert(preview().textContent.includes(staleMessage) && forms()[0].querySelectorAll('select')[1].value === '', 'Overlapping reanalysis marked old context fresh');
  const late = await startPlacementAnalysis();
  const savedCount = state.results.length;
  submit(forms()[0]);
  await wait(() => !forms().length && state.results.length === savedCount + 1, 'Save while reanalyzing failed');
  late.finish(mapped);
  assert(state.results[savedCount].reportSectionId === null && !('placementOnly' in state.results[savedCount]), 'Late reanalysis changed saved data');
  assert(maxActive === 1, 'Reanalysis duplicated AI requests');
  assert(failures.length === 0, failures.join('\n'));
  document.getElementById('result').textContent = 'PASS: existing suggestions, import/save regressions, TFL/SAP invalidation, stale labels/help/alternatives, placement-only retry, human edits, refresh/save/AI failures, and overlapping requests';
} catch (error) {
  document.getElementById('result').textContent = `FAIL: ${error.message}\n${failures.join('\n')}`;
}
</script></body></html>
