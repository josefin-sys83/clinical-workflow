<!doctype html>
<html><head><meta charset="utf-8"><title>Result suggestion checks</title></head>
<body><pre id="result">RUNNING</pre><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { MemoryRouter, Routes, Route } from 'react-router-dom';
import { CurrentUserProvider } from '/src/shared/auth/CurrentUserContext.tsx';
import StudyResultsPage from '/src/modules/StudyResults/StudyResultsPage.tsx';

// Synthetic evidence only. Every request is intercepted; no backend or provider is contacted.
const failures = [];
window.addEventListener('error', e => failures.push(e.message));
window.addEventListener('unhandledrejection', e => failures.push(String(e.reason)));
const state = { results: [], sections: [], supportingDocuments: [], locked: false,
  sectionOptions: [{ id: null, key: 'performance', title: 'Clinical Performance Results' },
    { id: null, key: 'safety', title: 'Safety Analysis' }] };
const response = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
const pending = [];
let active = 0, maxActive = 0;
const suggestion = { title: 'Infusion volume accuracy', reportSectionKey: 'performance',
  description: '190 episodes (95%) were within ±5%.', limitation: null };
const source = { headers: ['Outcome', 'Episodes', '%'], rows: [['Within ±5%', 190, 95], ['Outside', 10, 5]],
  provenance: { header: [{ filename: 'synthetic.xlsx', rowStart: 1, rowEnd: 1, columnStart: 1, columnEnd: 3 }],
    rows: [2, 3].map(n => [{ filename: 'synthetic.xlsx', rowStart: n, rowEnd: n, columnStart: 1, columnEnd: 3 }]) } };
window.fetch = async (url, init = {}) => {
  const path = String(url);
  if (path.endsWith('/workspace')) return response(state);
  if (path.endsWith('/milestones')) return response({ milestones: [] });
  if (path.endsWith('/preview')) {
    const filename = init.body.get('file').name;
    return response({ issues: [], drafts: Array.from({ length: filename === 'five.xlsx' ? 5 : 1 }, (_, i) => ({
      title: `${filename} sheet ${i + 1}`, type: filename.endsWith('.txt') ? 'listing' : 'table',
      content: filename.endsWith('.txt')
        ? { text: 'Synthetic dataset: volume accuracy and adverse event results.' }
        : structuredClone(source), sourceFilename: filename,
    })) });
  }
  if (path.endsWith('/suggest')) {
    active++; maxActive = Math.max(maxActive, active);
    return new Promise((resolve, reject) => {
      let finished = false;
      const finish = (body = suggestion, status = 200) => {
        if (finished) return;
        finished = true; active--; resolve(response(body, status));
      };
      init.signal?.addEventListener('abort', () => {
        if (finished) return;
        finished = true; active--; reject(new DOMException('Aborted', 'AbortError'));
      });
      pending.push({ body: JSON.parse(init.body), finish });
    });
  }
  if (path.endsWith('/results') && init.method === 'POST') {
    const body = JSON.parse(init.body);
    const item = { titleOrigin: 'human', sectionOrigin: 'human', descriptionOrigin: 'human', ...body,
      id: `r-${state.results.length}`, reportSectionId: body.reportSectionKey ? 'saved-section' : null,
      version: 1, status: 'draft', placement: 'unplaced', reportNumber: state.results.length + 1, lastDecision: null };
    delete item.reportSectionKey;
    state.results.push(item);
    state.sections = [{ id: 'saved-section', title: 'Clinical Performance Results' }];
    state.sectionOptions[0].id = 'saved-section';
    return response(item, 201);
  }
  throw new Error(`Unexpected API call: ${path}`);
};
const root = createRoot(document.getElementById('root'));
const render = key => root.render(React.createElement(MemoryRouter, { key, initialEntries: ['/projects/fixture/workflow/results'] },
  React.createElement(CurrentUserProvider, { user: { id: 'author', name: 'Author', roles: ['author'] }, status: 'ready' },
    React.createElement(Routes, null, React.createElement(Route, { path: '/projects/:projectId/workflow/results', element: React.createElement(StudyResultsPage) })))));
const wait = async (check, message) => {
  for (let i = 0; i < 250; i++) { if (check()) return; await new Promise(r => setTimeout(r, 20)); }
  throw new Error(message);
};
const assert = (value, message) => { if (!value) throw new Error(message); };
const forms = () => [...document.querySelectorAll('[aria-label="Import preview"] form')];
const button = (text, parent = document) => [...parent.querySelectorAll('button')].find(b => b.textContent.trim() === text);
const setInput = (el, value) => {
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(el, value);
  el.dispatchEvent(new Event('input', { bubbles: true }));
};
const upload = filename => {
  const el = document.querySelector('input[type=file][multiple]');
  const files = new DataTransfer(); files.items.add(new File(['synthetic'], filename));
  el.files = files.files; el.dispatchEvent(new Event('change', { bubbles: true }));
};
const submit = form => form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
try {
  render('initial');
  await wait(() => button('Upload file') && !button('Upload file').disabled, 'Workspace did not load');
  upload('five.xlsx');
  await wait(() => forms().length === 5 && pending.length === 1, 'Five drafts or first AI request missing');
  assert(state.results.length === 0, 'Import persisted before Save draft');
  setInput(forms()[0].querySelector('input'), 'My chosen title');
  pending[0].finish();
  for (let i = 1; i < 5; i++) {
    await wait(() => pending.length > i, `Missing queued request ${i}`);
    pending[i].finish();
  }
  await wait(() => forms().every(f => f.querySelector('textarea').value === suggestion.description), 'Descriptions not filled');
  assert(maxActive === 1, 'AI requests were launched concurrently');
  assert(forms()[0].querySelector('input').value === 'My chosen title', 'AI overwrote a human edit');
  assert(forms()[0].textContent.includes('Human-edited'), 'Human origin missing');
  assert(forms()[1].querySelectorAll('select')[1].value === 'key:performance', 'Preview section not assigned');
  const info = forms()[1].querySelector('[aria-label="About the AI suggestion for title"]');
  info.click();
  await wait(() => document.querySelector('[role="dialog"]')?.textContent.includes('Review and edit'), 'AI help did not open');
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await wait(() => !document.querySelector('[role="dialog"]'), 'AI help did not close with Escape');
  submit(forms()[1]);
  await wait(() => state.results.length === 1 && forms().length === 4, 'AI draft not saved');
  assert(state.results[0].titleOrigin === 'ai' && state.results[0].sectionOrigin === 'ai' && state.results[0].descriptionOrigin === 'ai', 'AI origins not sent on save');
  assert(JSON.stringify(state.results[0].content) === JSON.stringify(source), 'AI changed source values');
  submit(forms()[0]);
  await wait(() => state.results.length === 2 && forms().length === 3, 'Human-edited draft not saved');
  assert(state.results[1].titleOrigin === 'human' && state.results[1].descriptionOrigin === 'ai', 'Mixed origins not preserved');
  render('reload');
  await wait(() => document.body.textContent.includes('Infusion volume accuracy') && !forms().length, 'Reload lost saved result');
  assert(document.querySelector('[aria-label="Result review"]').textContent.includes('AI suggestion'), 'Saved AI label missing');

  upload('one.csv');
  await wait(() => pending.length === 6 && forms().length === 1, 'Failure test not imported');
  pending[5].finish({ message: 'AI request timed out.' }, 504);
  await wait(() => button('Retry AI suggestions'), 'Retry missing after timeout');
  assert(forms()[0].querySelector('table'), 'Timeout removed source table');
  setInput(forms()[0].querySelector('input'), 'Keep manual title');
  button('Retry AI suggestions').click();
  await wait(() => pending.length === 7, 'Retry did not call AI');
  pending[6].finish();
  await wait(() => forms()[0].querySelector('textarea').value === suggestion.description, 'Retry suggestion missing');
  assert(forms()[0].querySelector('input').value === 'Keep manual title', 'Retry replaced human title');
  button('Split detection').click();
  await wait(() => forms().length === 2 && pending.length === 8, 'Split did not queue fresh suggestions');
  assert(forms().every(f => f.querySelector('textarea').value === ''), 'Split kept stale descriptions');
  const boxes = [...document.querySelectorAll('[aria-label="Import preview"] input[type=checkbox]')];
  boxes[0].click(); boxes[2].click();
  await wait(() => !button('Merge selected detections').disabled, 'Merge selection missing');
  button('Merge selected detections').click();
  await wait(() => forms().length === 1, 'Merge failed');
  pending[7].finish({ ...suggestion, description: 'STALE split response' });
  await wait(() => pending.length === 9, 'Merged object not queued');
  assert(forms()[0].querySelector('textarea').value === '', 'Stale split response affected merged object');
  pending[8].finish();
  await wait(() => forms()[0].querySelector('textarea').value === suggestion.description, 'Merged suggestion missing');
  button('Cancel', forms()[0]).click();
  await wait(() => !forms().length, 'Cancel failed');

  upload('save-early.csv');
  await wait(() => pending.length === 10 && forms().length === 1, 'Early-save input missing');
  setInput(forms()[0].querySelector('input'), 'Save without AI');
  submit(forms()[0]);
  await wait(() => state.results.length === 3 && !forms().length, 'Pending AI blocked manual save');
  pending[9].finish();
  assert(state.results[2].title === 'Save without AI' && !state.results[2].description, 'Late response changed saved data');

  upload('mixed.txt');
  await wait(() => pending.length === 11 && forms().length === 1, 'Mixed-result input missing');
  const mixed = { title: 'Performance and safety results', reportSectionKey: null,
    alternativeSectionKeys: ['performance', 'safety'],
    description: 'This synthetic dataset contains performance and safety results.',
    limitation: 'Performance and safety span different sections. Choose placement manually.' };
  pending[10].finish(mixed);
  await wait(() => forms()[0].querySelector('textarea').value === mixed.description, 'Partial suggestion not applied');
  assert(document.querySelector('[aria-label="Import preview"]').textContent.includes(mixed.limitation), 'Placement explanation missing');
  assert(forms()[0].querySelectorAll('select')[1].value === '', 'AI assigned a section despite abstaining');
  assert(forms()[0].querySelectorAll('[aria-label^="About the AI suggestion"]').length === 2, 'Abstention incorrectly marked as an AI section suggestion');
  const mixedSection = forms()[0].querySelectorAll('select')[1];
  const help = document.getElementById(mixedSection.getAttribute('aria-describedby'));
  assert(help?.textContent.includes('Multiple result topics.') && help.textContent.includes('Clinical Performance Results; Safety Analysis'), 'Inline alternatives missing');
  assert(help.textContent.includes('parts of this content'), 'Alternatives imply whole-document placement');
  help.querySelector('button').click();
  await wait(() => document.querySelector('[role="dialog"]')?.textContent.includes(mixed.limitation), 'Placement explanation did not open');
  document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  await wait(() => !document.querySelector('[role="dialog"]'), 'Placement explanation did not close');
  submit(forms()[0]);
  await wait(() => state.results.length === 4 && !forms().length, 'Partial suggestion could not be saved');
  assert(state.results[3].reportSectionId === null && state.results[3].description === mixed.description, 'Partial suggestion changed during save');

  upload('manual-placement.txt');
  await wait(() => pending.length === 12 && forms().length === 1, 'Manual-placement input missing');
  const section = forms()[0].querySelectorAll('select')[1];
  Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value').set.call(section, 'key:performance');
  section.dispatchEvent(new Event('change', { bubbles: true }));
  pending[11].finish(mixed);
  await wait(() => forms()[0].querySelector('textarea').value === mixed.description, 'Manual-placement suggestion missing');
  assert(section.value === 'key:performance' && forms()[0].textContent.includes('Human-edited'), 'Abstention overwrote human placement');
  assert(!section.hasAttribute('aria-describedby'), 'Unassigned help remains after manual selection');
  button('Cancel', forms()[0]).click();
  await wait(() => !forms().length, 'Manual-placement draft not cancelled');

  upload('unreadable.txt');
  await wait(() => pending.length === 13 && forms().length === 1, 'Unreadable input missing');
  assert(!forms()[0].querySelector('[aria-label="Why no report section was selected"]'), 'Empty field treated as AI abstention');
  pending[12].finish({ title: null, reportSectionKey: null, description: null,
    limitation: 'Source text is unreadable.', alternativeSectionKeys: [] });
  await wait(() => forms()[0].textContent.includes('AI did not suggest a section.'), 'Generic abstention help missing');
  assert(!forms()[0].textContent.includes('Multiple result topics.'), 'Unreadable source labelled as mixed content');
  assert(failures.length === 0, failures.join('\n'));
  document.getElementById('result').textContent = 'PASS: five sequential suggestions, user-edit protection, info popover, origins on save/reload, timeout/retry, split/merge invalidation, unchanged evidence, save before AI response, and partial suggestions with manual placement';
} catch (error) {
  document.getElementById('result').textContent = `FAIL: ${error.message}\n${failures.join('\n')}`;
}
</script></body></html>
