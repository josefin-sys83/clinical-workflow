<!doctype html>
<html><head><meta charset="utf-8"><title>Result suggestion checks</title></head>
<body><pre id="result">RUNNING</pre><div id="root"></div>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { MemoryRouter, Routes, Route } from 'react-router-dom';
import { CurrentUserProvider } from '/src/shared/auth/CurrentUserContext.tsx';

// Synthetic evidence only. Every request is intercepted; no backend or provider is contacted.
const failures = [];
window.addEventListener('error', e => failures.push(e.message));
window.addEventListener('unhandledrejection', e => failures.push(String(e.reason)));
const state = { results: [], sections: [], supportingDocuments: [], locked: false,
  sectionOptions: [{ id: null, key: 'performance', title: 'Clinical Performance Results' },
    { id: null, key: 'safety', title: 'Safety Analysis' }] };
const response = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
const pending = [];
let active = 0, maxActive = 0;
let saveFailure = false, ignoreAbort = false, holdParse = false;
const savedInputs = [], parsedInputs = [], pendingParses = [];
const tableText = 'Group\tN\nTreatment\t42';
const tableContent = { headers: ['Group', 'N'], rows: [['Treatment', '42']] };
const tableSuggestion = { title: 'Study population', reportSectionKey: 'performance',
  description: 'The table reports 42 in the Treatment group.', limitation: null };
const figureImage = { dataUrl: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aN2kAAAAASUVORK5CYII=' };
const suggestion = { title: 'Infusion volume accuracy', reportSectionKey: 'performance',
  description: '190 episodes (95%) were within ±5%.', limitation: null };
const source = { headers: ['Outcome', 'Episodes', '%'], rows: [['Within ±5%', 190, 95], ['Outside', 10, 5]],
  provenance: { header: [{ filename: 'synthetic.xlsx', rowStart: 1, rowEnd: 1, columnStart: 1, columnEnd: 3 }],
    rows: [2, 3].map(n => [{ filename: 'synthetic.xlsx', rowStart: n, rowEnd: n, columnStart: 1, columnEnd: 3 }]) } };
window.fetch = async (url, init = {}) => {
  const path = String(url);
  if (path.endsWith('/workspace')) return response(state);
  if (path.endsWith('/milestones')) return response({ milestones: [] });
  if (path.endsWith('/parse-table')) {
    const text = JSON.parse(init.body).text;
    parsedInputs.push(text);
    const parsed = () => text === tableText
      ? response(structuredClone(tableContent))
      : response({ message: 'Include a header and at least one data row' }, 400);
    if (holdParse) return new Promise(resolve => pendingParses.push(() => resolve(parsed())));
    return parsed();
  }
  if (path.endsWith('/preview')) {
    const filename = init.body.get('file').name;
    if (filename.endsWith('.png')) return response({ issues: [], drafts: [{ title: filename,
      type: 'figure', content: { image: figureImage }, sourceFilename: filename }] });
    return response({ issues: [], drafts: Array.from({ length: filename === 'twelve.xlsx' ? 12 : filename === 'five.xlsx' ? 5 : 1 }, (_, i) => ({
      title: `${filename} sheet ${i + 1}`, type: filename.endsWith('.txt') ? 'listing' : 'table',
      content: filename.endsWith('.txt')
        ? { text: 'Synthetic dataset: volume accuracy and adverse event results.' }
        : structuredClone(source), sourceFilename: filename,
    })) });
  }
  if (path.endsWith('/suggest')) {
    active++; maxActive = Math.max(maxActive, active);
    return new Promise((resolve, reject) => {
      let finished = false;
      const finish = (body = suggestion, status = 200) => {
        if (finished) return;
        finished = true; active--; resolve(response(body, status));
      };
      init.signal?.addEventListener('abort', () => {
        if (ignoreAbort) return; // Exercise late responses even when transport cancellation fails.
        if (finished) return;
        finished = true; active--; reject(new DOMException('Aborted', 'AbortError'));
      });
      const fail = () => { if (!finished) { finished = true; active--; reject(new TypeError('Network unavailable')); } };
      pending.push({ body: JSON.parse(init.body), signal: init.signal, finish, fail });
    });
  }
  if (path.endsWith('/results') && init.method === 'POST') {
    const body = JSON.parse(init.body);
    if (saveFailure) { saveFailure = false; return response({ message: 'Save unavailable' }, 500); }
    savedInputs.push(body);
    const item = { titleOrigin: 'human', sectionOrigin: 'human', descriptionOrigin: 'human', ...body,
      id: `r-${state.results.length}`, reportSectionId: body.reportSectionKey ? 'saved-section' : null,
      version: 1, status: 'draft', placement: 'unplaced', reportNumber: state.results.length + 1, lastDecision: null };
    delete item.reportSectionKey;
    state.results.push(item);
    state.sections = [{ id: 'saved-section', title: 'Clinical Performance Results' }];
    state.sectionOptions[0].id = 'saved-section';
    return response(item, 201);
  }
  throw new Error(`Unexpected API call: ${path}`);
};
const root = createRoot(document.getElementById('root'));
const render = key => root.render(React.createElement(MemoryRouter, { key, initialEntries: ['/projects/fixture/workflow/results'] },
  React.createElement(CurrentUserProvider, { user: { id: 'author', name: 'Author', roles: ['author'] }, status: 'ready' },
    React.createElement(Routes, null, React.createElement(Route, { path: '/projects/:projectId/workflow/results', element: React.createElement(StudyResultsPage) })))));
const wait = async (check, message) => {
  for (let i = 0; i < 250; i++) { if (check()) return; await new Promise(r => setTimeout(r, 20)); }

const assert = (value, message) => { if (!value) throw new Error(message); };
const forms = () => [...document.querySelectorAll('[aria-label="Import preview"] form')];
const button = (text, parent = document) => [...parent.querySelectorAll('button')].find(b => b.textContent.trim() === text);
const setInput = (el, value) => {
  Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(el, value);
  el.dispatchEvent(new Event('input', { bubbles: true }));
};

};

  render('initial');
  await wait(() => button('Upload file') && !button('Upload file').disabled, 'Workspace did not load');

  for (let i = 0; i < 12; i++) {

    assert(savedInputs.at(-1).title === 'Save without waiting' && !savedInputs.at(-1).description, 'Late response changed saved draft');

    form = await openEntry(mode);
    fillTable(form, mode);
    call = await startSuggestion(form);
    ignoreAbort = true;
    button(mode === 'Paste table' ? 'Build manually' : 'Paste table').click();
    await wait(() => call.signal.aborted && document.querySelector('form') !== form, 'Mode change did not cancel analysis');
    call.finish({ ...tableSuggestion, title: 'LATE mode response' });
    ignoreAbort = false;
    const replacement = document.querySelector('form');
    await new Promise(resolve => setTimeout(resolve, 50));
    assert(field(replacement, 'Title').value === '', 'Previous mode response filled new form');
    await closeEntry(replacement);

    form = await openEntry(mode);
    fillTable(form, mode);
    setField(field(form, 'Title'), 'Entirely manual');
    const attempts = pending.length;
    button('Save draft', form).click();
    await wait(() => !document.querySelector('form'), 'Saving without AI failed');
    assert(pending.length === attempts && savedInputs.at(-1).title === 'Entirely manual', 'Manual save invoked AI');
  }

  let form = await openEntry('Paste table');
  fillTable(form, 'Paste table');
  holdParse = true;
  const attemptsBeforeParse = pending.length;
  button('Suggest with AI', form).click();
  await wait(() => pendingParses.length === 1, 'Deferred parser not called');
  setField(field(form, 'Table data'), 'Different source');
  await wait(() => !button('Suggest with AI', form).disabled, 'Changed paste did not cancel analysis');
  pendingParses[0](); holdParse = false;
  await new Promise(resolve => setTimeout(resolve, 50));
  assert(pending.length === attemptsBeforeParse, 'Obsolete parsed content reached AI');
  await closeEntry(form);

  for (const type of ['listing', 'figure']) {
    form = await openEntry('Build manually');
    setField(field(form, 'Type'), type);
    await wait(() => field(form, type === 'listing' ? 'Listing content' : 'Figure data'), 'Text input missing');
    setField(field(form, type === 'listing' ? 'Listing content' : 'Figure data'), 'Synthetic source text');
    const call = await startSuggestion(form);
    assert(call.body.type === type && call.body.content.text === 'Synthetic source text', 'Manual text evidence changed');
    call.finish({ ...tableSuggestion, description: 'Synthetic source text.' });
    await wait(() => field(form, 'Title').value === tableSuggestion.title, 'Text suggestion missing');
    await closeEntry(form);
  }

  for (const clearTitle of [false, true]) {
    form = await openEntry('Build manually');
    setField(field(form, 'Type'), 'figure');
    await wait(() => form.querySelector('input[type=file]'), 'Figure input missing');
    if (clearTitle) { setField(field(form, 'Title'), 'Remove me'); setField(field(form, 'Title'), ''); }
    const files = new DataTransfer(); files.items.add(new File(['synthetic'], 'default-title.png', { type: 'image/png' }));
    const fileInput = form.querySelector('input[type=file]');
    fileInput.files = files.files; fileInput.dispatchEvent(new Event('change', { bubbles: true }));
    await wait(() => form.querySelector('img') && !form.querySelector('fieldset').disabled, 'Figure preview missing');
    assert(field(form, 'Title').value === (clearTitle ? '' : 'default-title.png'), 'Filename default overwrote human blank');
    const call = await startSuggestion(form);
    assert(call.body.content.image.dataUrl === figureImage.dataUrl, 'Figure image not sent unchanged');
    call.finish({ ...tableSuggestion, title: 'Suggested figure title' });
    await wait(() => !button('Suggest with AI', form).disabled, 'Figure suggestion not finished');
    assert(field(form, 'Title').value === (clearTitle ? '' : 'Suggested figure title'), 'Default title blocked AI or AI overwrote human blank');
    await closeEntry(form);
  }
  assert(failures.length === 0, failures.join('\n'));
  document.getElementById('result').textContent = 'PASS: file import regression and twelve-result 429 batch; Paste table and Build manually explicit AI, validation, human edits and blanks, save/failure/retry, stale responses, manual save, listing/figure evidence and automatic defaults. Simulated flows only; model quality not evaluated.';
} catch (error) {
  document.getElementById('result').textContent = `FAIL: ${error.message}\n${failures.join('\n')}`;
}
</script></body></html>
